aid: francis-medical
name: Francis Medical
description: 'Francis Medical is a privately held medical device company headquartered
  in Maple Grove, Minnesota, founded in 2018 by Michael Hoey and named for his father,
  who died of prostate cancer in 1991. It develops the Vanquish Water Vapor Ablation
  System, a transurethral outpatient platform that ablates targeted prostate tissue
  using the thermal energy stored in sterile water vapor delivered in short bursts
  through a catheter, with the aim of treating localized disease while avoiding the
  incontinence and sexual dysfunction associated with radical prostatectomy and radiation.
  The company received FDA Breakthrough Device Designation in 2023 and 510(k) clearance
  for prostate tissue ablation in December 2025, and it is running the VAPOR 1 and
  VAPOR 2 clinical studies alongside a long-term registry; it has signalled intent
  to extend the same water vapor platform to bladder and kidney cancer. Francis Medical
  has raised roughly $160 million to date, including an $80 million Series C in January
  2025 co-led by Solas BioVentures and Arboretum Ventures, with earlier participation
  from Coloplast. It is led by president and CEO Mike Kujak. Francis Medical publishes
  a physician locator, an electronic instructions-for-use (eIFU) library and a coordinated
  vulnerability disclosure policy for its devices and embedded software, but operates
  no public developer program, API documentation, or machine-readable API contract.'
