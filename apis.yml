  detail: Francis Medical's own Product Security page states that "our current product
    offerings do not include network-connected components" — the Vanquish Water Vapor
    Ablation System is a capital console and single-use catheter operated at the bedside,
    so there is no developer portal, no api./developer./docs./portal. hostname in DNS,
    and the only machine-readable JSON on the host is the marketing site's stock WordPress
    core REST API at /wp-json/.
